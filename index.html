<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Long Simmer — POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6EE;
    --panel:#FFFFFF;
    --panel-2:#FDF9F2;
    --sidebar:#2C190F;
    --sidebar-2:#3A2216;
    --ink:#2A1B12;
    --ink-soft:#7C6C5C;
    --line:#EEE4D5;
    --gold:#B08D57;
    --olive:#6E6A45;
    --olive-dark:#5A5738;
    --danger:#A24B3E;
    --shadow:0 10px 30px -12px rgba(44,25,15,0.18);
    box-sizing:border-box;
  }
  *{box-sizing:inherit;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .serif{font-family:'Fraunces',serif;}
  a{color:inherit;}

  /* ---------- App shell ---------- */
  .app{display:grid;grid-template-columns:240px 1fr;height:100vh;min-height:640px;}
  @media (max-width:900px){ .app{grid-template-columns:72px 1fr;} .nav-label{display:none;} }

  /* ---------- Left nav ---------- */
  .nav{
    background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));
    color:#EFE6D8;
    display:flex;flex-direction:column;
    padding:22px 16px;
    position:relative;
    overflow:hidden;
  }
  .brand{display:flex;align-items:center;gap:12px;padding:4px 6px 22px;border-bottom:1px solid rgba(239,230,216,0.12);margin-bottom:18px;}
  .brand .pot{font-size:26px;}
  .brand h1{font-size:17px;margin:0;line-height:1.15;letter-spacing:.2px;}
  .brand .tag{font-size:9.5px;letter-spacing:2.5px;color:#C9B79A;margin-top:3px;}
  .navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
  .navlist button{
    all:unset;display:flex;align-items:center;gap:12px;
    padding:10px 12px;border-radius:10px;cursor:pointer;
    font-size:14px;color:#E7DCC9;width:100%;
  }
  .navlist button:hover{background:rgba(255,255,255,0.06);}
  .navlist button.active{background:#EFE3CC;color:#2C190F;font-weight:600;}
  .navlist .ic{width:18px;text-align:center;font-size:15px;}
  .nav-bottom{margin-top:auto;text-align:center;padding-top:18px;opacity:.85;}
  .nav-bottom .pot{font-size:34px;display:block;margin:0 auto 8px;}
  .nav-bottom h2{font-size:14px;margin:0;font-family:'Fraunces',serif;}
  .nav-bottom .tag{font-size:8.5px;letter-spacing:2px;color:#C9B79A;margin-top:4px;}

  /* ---------- Main ---------- */
  .main{display:grid;grid-template-rows:auto 1fr;min-width:0;}
  .topbar{
    background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));
    color:#EFE6D8;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;
  }
  .topbar .flow{display:flex;align-items:center;gap:14px;font-family:'Fraunces',serif;font-style:italic;color:#D9CBB0;font-size:15px;}
  .topbar .flow .rule{width:34px;height:1px;background:rgba(217,203,176,0.4);}
  .topbar .flow span.arrow{opacity:.5;font-style:normal;}
  .topbar .right{display:flex;align-items:center;gap:22px;}
  .topbar .clock{text-align:right;font-size:12px;color:#C9B79A;}
  .topbar .clock b{display:block;font-size:15px;color:#F2E9D8;font-weight:600;}
  .user{display:flex;align-items:center;gap:10px;}
  .user .av{width:34px;height:34px;border-radius:50%;background:#C9B79A;display:flex;align-items:center;justify-content:center;color:#2C190F;font-weight:700;}
  .user .who{font-size:12.5px;line-height:1.3;}
  .user .who b{display:block;font-size:13.5px;}

  #viewRoot{min-height:0;display:flex;flex-direction:column;}
  .workspace{display:grid;grid-template-columns:1fr 380px;min-height:0;flex:1;}
  @media (max-width:1180px){ .workspace{grid-template-columns:1fr 340px;} }

  /* ---------- Ordering panel ---------- */
  .order-area{display:flex;flex-direction:column;min-height:0;padding:20px 22px 0;overflow:hidden;}
  .mode-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .modes{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;}
  .modes button{all:unset;cursor:pointer;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .modes button.active{background:var(--olive);color:#fff;}
  .field{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13.5px;font-weight:600;}
  .field select{all:unset;font-weight:700;cursor:pointer;}
  .field .badge{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;min-width:14px;text-align:center;}

  .search{position:relative;margin-bottom:16px;}
  .search input{
    width:100%;padding:12px 16px 12px 40px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);font-size:14px;font-family:inherit;color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .search .sic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);}

  .cats{display:flex;gap:20px;min-height:0;flex:1;}
  .catlist{list-style:none;margin:0;padding:0;width:118px;flex:none;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
  .catlist button{
    all:unset;cursor:pointer;width:100%;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;
    color:var(--ink-soft);display:flex;align-items:center;gap:9px;
  }
  .catlist button:hover{background:var(--panel);}
  .catlist button.active{background:var(--sidebar);color:#F2E9D8;}
  .catlist .ic{font-size:15px;}

  .grid-wrap{flex:1;min-width:0;overflow-y:auto;padding-bottom:20px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media (max-width:1400px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr);}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .thumb{
    height:110px;display:flex;align-items:center;justify-content:center;font-size:42px;
    background:linear-gradient(135deg,var(--tc1,#E7D3B4),var(--tc2,#C9A876));
  }
  .cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .cbody h3{margin:0;font-size:14.5px;line-height:1.3;font-weight:700;}
  .cbody p{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.4;min-height:32px;}
  .cfoot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px;}
  .price{font-weight:700;font-size:14.5px;}
  .addbtn{
    all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;background:var(--sidebar);
    color:#F2E9D8;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
    transition:transform .12s ease;
  }
  .addbtn:hover{transform:scale(1.08);background:var(--olive);}

  /* ---------- Order status strip ---------- */
  .statusbar{
    display:flex;align-items:center;gap:22px;padding:14px 28px;border-top:1px solid var(--line);
    background:var(--panel);flex-wrap:wrap;
  }
  .statusbar .lbl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--ink-soft);}
  .steps{display:flex;align-items:center;gap:10px;flex:1;overflow-x:auto;}
  .step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}
  .step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;}
  .step.done .dot{background:var(--olive);border-color:var(--olive);color:#fff;}
  .step.current .dot{border-color:var(--olive);color:var(--olive);font-weight:700;}
  .steplink{width:30px;height:1px;background:var(--line);}

  /* ---------- Right: order panel ---------- */
  .order-panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
  .op-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;}
  .op-head h2{margin:0;font-size:17px;}
  .op-head .oid{font-size:12px;color:var(--ink-soft);}
  .cart{flex:1;overflow-y:auto;padding:0 16px;display:flex;flex-direction:column;gap:10px;}
  .empty-cart{margin:40px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;line-height:1.6;}
  .citem{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;}
  .cthumb{width:52px;height:52px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,var(--tc1,#E7D3B4),var(--tc2,#C9A876));}
  .cinfo{flex:1;min-width:0;}
  .cinfo .nm{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:700;font-size:13.5px;}
  .cinfo .nm .rm{all:unset;cursor:pointer;color:var(--ink-soft);font-size:13px;}
  .cinfo .nm .rm:hover{color:var(--danger);}
  .cinfo .pr{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .qty{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .qty button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .qty button:hover{background:var(--panel-2);}
  .qty .n{font-weight:700;font-size:13px;min-width:14px;text-align:center;}
  .line-total{font-weight:700;font-size:13.5px;white-space:nowrap;}

  .totals{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px;}
  .trow{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);}
  .trow input{width:70px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-family:inherit;font-size:13px;}
  .trow.grand{color:var(--ink);font-weight:800;font-size:19px;padding-top:6px;border-top:1px dashed var(--line);}

  .actions{display:flex;gap:10px;padding:14px 20px 6px;}
  .btn-kitchen{
    all:unset;flex:1;text-align:center;cursor:pointer;background:var(--olive);color:#fff;font-weight:700;
    padding:13px;border-radius:12px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-kitchen:hover{background:var(--olive-dark);}
  .btn-kitchen:disabled{opacity:.45;cursor:not-allowed;}
  .btn-print{all:unset;cursor:pointer;width:46px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;}
  .btn-print:hover{background:var(--panel-2);}

  .paytype{padding:10px 20px 4px;}
  .paytype .ptl{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .payopts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .payopts button{
    all:unset;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 6px;
    display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-soft);
  }
  .payopts button .i{font-size:16px;}
  .payopts button.active{border-color:var(--olive);background:#F1EFE3;color:var(--ink);}

  .btn-complete{
    all:unset;display:block;margin:14px 20px 18px;cursor:pointer;text-align:center;background:var(--sidebar);color:#F2E9D8;
    font-weight:700;padding:14px;border-radius:12px;font-size:14.5px;
  }
  .btn-complete:hover{background:var(--olive-dark);}
  .btn-complete:disabled{opacity:.4;cursor:not-allowed;}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--sidebar);color:#F2E9D8;
    padding:12px 22px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:50;max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  /* ---------- Generic module views ---------- */
  .view{flex:1;min-height:0;overflow-y:auto;padding:22px 28px 40px;}
  .view-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .view-head h2{margin:0;font-size:22px;}
  .muted{color:var(--ink-soft);font-size:14px;}

  .btn-primary{all:unset;cursor:pointer;background:var(--olive);color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:10px;}
  .btn-primary:hover{background:var(--olive-dark);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-outline{all:unset;cursor:pointer;border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:13px;padding:8px 14px;border-radius:10px;}
  .btn-outline:hover{background:var(--panel-2);}

  .inline-form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow);}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px;}
  .form-row{display:flex;flex-direction:column;gap:5px;justify-content:center;}
  .form-row label{font-size:11.5px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .form-row input, .form-row select, .form-row textarea{
    border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);
  }
  .form-row input[type=checkbox]{width:auto;}
  .form-row textarea{resize:vertical;min-height:40px;}
  .form-actions{display:flex;gap:10px;}

  .data-table{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
  .drow{display:grid;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .drow:last-child{border-bottom:none;}
  .drow.dhead{background:var(--panel-2);font-weight:700;color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:10px 16px;}
  .dcell-actions{display:flex;gap:6px;justify-content:flex-end;}
  .pillbtn{all:unset;cursor:pointer;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;}
  .pillbtn:hover{background:var(--panel-2);}
  .lowstock{color:var(--danger);font-weight:700;}
  .tag-pill{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;}

  .menurow{grid-template-columns:44px 1.6fr 130px 90px 70px 90px;}
  .invrow{grid-template-columns:1.4fr 80px 230px 100px 60px;}
  .exprow{grid-template-columns:100px 120px 1.6fr 100px 50px;}
  .suprow{grid-template-columns:1fr 140px 130px 1.4fr 50px;}

  .tables-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;}
  .tcard{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px 14px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s ease;}
  .tcard:hover{transform:translateY(-2px);}
  .tcard .tid{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
  .tcard .tseats{font-size:11.5px;color:var(--ink-soft);margin:2px 0 8px;}
  .tcard .tstatus{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;display:inline-block;}
  .tcard .ttotal{margin-top:8px;font-weight:700;font-size:13.5px;}
  .tcard.status-free{border-color:#CFE0BE;}
  .tcard.status-free .tstatus{background:#E4EFD8;color:#5A7A3C;}
  .tcard.status-occupied{border-color:#E3C79A;}
  .tcard.status-occupied .tstatus{background:#F5E4C2;color:#95611F;}
  .tcard.status-reserved{border-color:#C9D3E6;}
  .tcard.status-reserved .tstatus{background:#E1E8F5;color:#3F5A8C;}
  .tcard .tcycle{margin-top:8px;display:inline-block;}

  .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
  .kcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;}
  .khead{display:flex;justify-content:space-between;align-items:center;font-size:14px;}
  .kpill{background:var(--sidebar);color:#F2E9D8;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .ksub{font-size:12px;color:var(--ink-soft);}
  .klist{margin:0;padding-left:18px;font-size:13px;line-height:1.6;}
  .kdone{font-size:12.5px;font-weight:700;color:var(--olive);}

  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;}
  .stat-card .sl{font-size:11.5px;color:var(--ink-soft);font-weight:700;}
  .stat-card b{font-size:22px;font-family:'Fraunces',serif;}

  .report-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:900px){.report-cols{grid-template-columns:1fr;}}
  .report-block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);}
  .report-block h3{margin:0 0 12px;font-size:14.5px;}
  .barlist{display:flex;flex-direction:column;gap:10px;}
  .baritem{display:grid;grid-template-columns:120px 1fr 76px;align-items:center;gap:10px;font-size:12.5px;}
  .btrack{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden;}
  .bfill{height:100%;background:var(--olive);border-radius:99px;}
  .bv{text-align:right;font-weight:700;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#DCCFB6;border-radius:8px;}

  /* ---------- Printable receipt ---------- */
  #receiptArea{display:none;}
  .rc{width:280px;font-family:'Work Sans',monospace,sans-serif;color:#111;font-size:12.5px;line-height:1.5;}
  .rc-center{text-align:center;}
  .rc-name{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:0;}
  .rc-tag{font-size:9.5px;letter-spacing:1.5px;margin:2px 0 8px;}
  .rc-rule{border-top:1px dashed #111;margin:8px 0;}
  .rc-row{display:flex;justify-content:space-between;gap:8px;}
  .rc-items .rc-row{margin-bottom:3px;}
  .rc-item-name{flex:1;}
  .rc-grand{font-weight:800;font-size:14.5px;}
  .rc-foot{margin-top:10px;font-size:11px;}

  @media print{
    body *{visibility:hidden;}
    #receiptArea, #receiptArea *{visibility:visible;}
    #receiptArea{display:block;position:absolute;top:0;left:0;width:100%;padding:16px;}
    .rc{width:100%;max-width:300px;margin:0 auto;}
  }

  /* ---------- Login screen ---------- */
  .login-screen{
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:radial-gradient(circle at top,var(--sidebar-2),var(--sidebar) 70%);
    padding:20px;
  }
  .login-card{
    background:var(--panel);border-radius:20px;box-shadow:var(--shadow);
    padding:36px 32px;width:100%;max-width:360px;text-align:center;
  }
  .login-pot{font-size:38px;display:block;margin-bottom:6px;}
  .login-card h1{margin:0;font-size:21px;}
  .login-tag{font-size:10px;letter-spacing:2.5px;color:var(--ink-soft);margin:4px 0 22px;}
  .login-form{display:flex;flex-direction:column;gap:12px;text-align:left;}
  .login-form .form-row label{color:var(--ink-soft);}
  .login-error{color:var(--danger);font-size:12.5px;min-height:16px;text-align:center;}
  .login-submit{display:block;width:100%;text-align:center;padding:12px;font-size:14px;}

  /* ---------- Logout button ---------- */
  .user{position:relative;}
  .logout-btn{all:unset;cursor:pointer;margin-left:6px;font-size:15px;color:#C9B79A;padding:6px;border-radius:8px;}
  .logout-btn:hover{background:rgba(255,255,255,0.08);color:#F2E9D8;}
</style>

<body>

/* ---------- generic diff-sync: makes remote table match a local array ---------- */
async function syncCollection(table, rows){
  const {data: remote, error: selErr} = await sb.from(table).select('id');
  if(selErr){ console.error('read failed for '+table, selErr); toast('Database error on '+table+': '+selErr.message); return false; }
  const localIds = new Set(rows.map(r=>String(r.id)));
  const toDelete = (remote||[]).filter(r=>!localIds.has(String(r.id))).map(r=>r.id);
  if(toDelete.length){
    const {error} = await sb.from(table).delete().in('id', toDelete);
    if(error){ console.error('delete failed for '+table, error); toast('Database error on '+table+': '+error.message); return false; }
  }
  if(rows.length){
    const {error} = await sb.from(table).upsert(rows.map(rowMap[table]));
    if(error){ console.error('upsert failed for '+table, error); toast('Database error on '+table+': '+error.message); return false; }
  }
  return true;
}

let DB;
let dbReady = false;

async function loadDB(){
  const fallback = defaultDB();
  try{
    const [sRes, uRes, mRes, tRes, oRes, invRes, expRes, supRes] = await Promise.all([
      sb.from('settings').select('*').limit(1),
      sb.from('app_users').select('*'),
      sb.from('menu_items').select('*'),
      sb.from('restaurant_tables').select('*'),
      sb.from('orders').select('*'),
      sb.from('inventory').select('*'),
      sb.from('expenses').select('*'),
      sb.from('suppliers').select('*'),
    ]);

    const errors = [sRes,uRes,mRes,tRes,oRes,invRes,expRes,supRes].map(r=>r.error).filter(Boolean);
    if(errors.length){
      console.error('Supabase read errors:', errors);
      DB = fallback;
      dbReady = false;
      toast('Database access error: '+errors[0].message+' — check table grants in Supabase');
      return;
    }

    const settingsRow = (sRes.data && sRes.data[0]) || null;

    DB = {
      orderCounter: settingsRow ? (settingsRow.order_counter||426) : fallback.orderCounter,
      settings: settingsRow ? {name:settingsRow.name, tagline:settingsRow.tagline, currency:settingsRow.currency, servicePct:Number(settingsRow.service_pct)} : fallback.settings,
      users: (uRes.data && uRes.data.length) ? uRes.data.map(fromUserRow) : fallback.users,
      menu: (mRes.data && mRes.data.length) ? mRes.data.map(fromMenuRow) : fallback.menu,
      tables: (tRes.data && tRes.data.length) ? tRes.data.map(fromTableRow) : fallback.tables,
      orders: (oRes.data||[]).map(fromOrderRow),
      inventory: (invRes.data && invRes.data.length) ? invRes.data.map(fromInvRow) : fallback.inventory,
      expenses: (expRes.data||[]).map(fromExpRow),
      suppliers: (supRes.data && supRes.data.length) ? supRes.data.map(fromSupRow) : fallback.suppliers,
    };

    // first-run seeding: push any collection Supabase genuinely had nothing for yet
    const seedTasks = [];
    if(!settingsRow) seedTasks.push(sb.from('settings').upsert([rowMap.settings(DB.settings)]));
    if(!uRes.data || !uRes.data.length) seedTasks.push(syncCollection('app_users', DB.users));
    if(!mRes.data || !mRes.data.length) seedTasks.push(syncCollection('menu_items', DB.menu));
    if(!tRes.data || !tRes.data.length) seedTasks.push(syncCollection('restaurant_tables', DB.tables));
    if(!invRes.data || !invRes.data.length) seedTasks.push(syncCollection('inventory', DB.inventory));
    if(!supRes.data || !supRes.data.length) seedTasks.push(syncCollection('suppliers', DB.suppliers));
    if(seedTasks.length) await Promise.all(seedTasks);

    dbReady = true;
  }catch(e){
    console.error('Supabase load failed, working offline in this browser only', e);
    DB = fallback;
    dbReady = false;
    toast("Couldn't reach the database — working offline in this browser tab only");
  }
}

    syncCollection('orders', DB.orders),
    syncCollection('inventory', DB.inventory),
    syncCollection('expenses', DB.expenses),
    syncCollection('suppliers', DB.suppliers),
  ]);
  if(results[0] && results[0].error){
    console.error('settings save failed', results[0].error);
    toast('Database error saving settings: '+results[0].error.message);
  }
}

/* ---------- realtime: pick up changes made from other devices ---------- */
let realtimeStarted = false;
let refreshTimer = null;
function scheduleRefresh(){
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async ()=>{
    await loadDB();
    if(currentUser){ const u = DB.users.find(x=>x.id===currentUser.id); if(u) currentUser = u; }
    if(document.getElementById('appRoot').style.display !== 'none') render();
  }, 500);
}
function startRealtime(){
  if(realtimeStarted) return;
  realtimeStarted = true;
  const tables = ['settings','app_users','menu_items','restaurant_tables','orders','inventory','expenses','suppliers'];
  const channel = sb.channel('tls-live-changes');
  tables.forEach(t=>{
    channel.on('postgres_changes', {event:'*', schema:'public', table:t}, scheduleRefresh);
  });
  channel.subscribe();
}

function money(n){ return (DB.settings.currency||'৳') + Math.round(n||0).toLocaleString('en-IN'); }
function findItem(id){ return DB.menu.find(m=>m.id===id); }
function subtotal(){ return state.cart.reduce((s,c)=>{ const it=findItem(c.id); return it? s+it.price*c.qty : s; },0); }
function serviceCharge(){ return Math.round((subtotal()-state.discount) * ((DB.settings.servicePct||0)/100)); }
function grandTotal(){ return Math.max(0, subtotal() - state.discount + serviceCharge()); }
function val(id){ return document.getElementById(id).value.trim(); }
function escapeAttr(str){ return String(str==null?'':str).replace(/"/g,'&quot;'); }
function timeAgo(iso){
  const mins = Math.max(0, Math.round((Date.now()-new Date(iso).getTime())/60000));
  if(mins<1) return 'just now';
  if(mins<60) return mins+' min ago';
  return Math.floor(mins/60)+' hr '+(mins%60)+' min ago';
}

function loadTableIntoState(tableId){
  const t = DB.tables.find(x=>x.id===tableId);
  if(!t) return;
  if(t.orderId){
    const ord = DB.orders.find(o=>o.id===t.orderId && o.status!=='Completed');
    if(ord){
      state.cart = ord.items.map(it=>({id:it.id, qty:it.qty})).filter(c=>findItem(c.id));
      state.discount = ord.discount||0;
      state.payType = ord.payType||'cash';
      state.orderId = ord.id;
      state.status = ord.status;
      state.mode = ord.mode||'dinein';
      state.table = t.id;
      return;
    }
  }
  state.cart=[]; state.discount=0; state.payType='cash';
  state.orderId = nextOrderId(); state.status='New'; state.table=t.id;
}

function sendToKitchen(){
  if(state.cart.length===0) return;
  const itemsSnapshot = state.cart.map(c=>{ const m=findItem(c.id); return {id:c.id,name:m.name,price:m.price,qty:c.qty}; });
  let order = DB.orders.find(o=>o.id===state.orderId);
  if(order){
    Object.assign(order, {
      items:itemsSnapshot, discount:state.discount, payType:state.payType, mode:state.mode, table:state.table,
      subtotal:subtotal(), service:serviceCharge(), total:grandTotal(), updatedAt:new Date().toISOString()
    });
    if(order.status==='New') order.status='Confirmed';
  } else {
    order = {
      id: state.orderId, mode: state.mode, table: state.table, guests: state.guests,
      items: itemsSnapshot, subtotal: subtotal(), discount: state.discount, service: serviceCharge(),
      total: grandTotal(), payType: state.payType, status:'Confirmed',
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    };
    DB.orders.push(order);
  }
  state.status = order.status;
  if(state.mode==='dinein'){
    const t = DB.tables.find(x=>x.id===state.table);
    if(t){ t.orderId = order.id; t.status = 'occupied'; }
  }
  saveDB();
  renderStatus();
  toast('Order #'+String(state.orderId).padStart(5,'0')+' sent to kitchen 🔥');
}

function completeOrder(){
  if(state.cart.length===0) return;
  const itemsSnapshot = state.cart.map(c=>{ const m=findItem(c.id); return {id:c.id,name:m.name,price:m.price,qty:c.qty}; });
  let order = DB.orders.find(o=>o.id===state.orderId);
  if(!order){
    order = { id: state.orderId, mode: state.mode, table: state.table, guests: state.guests, items: itemsSnapshot, createdAt: new Date().toISOString() };
    DB.orders.push(order);
  } else {
    order.items = itemsSnapshot;
  }
  Object.assign(order, {
    discount: state.discount, payType: state.payType, mode: state.mode, table: state.table,
    subtotal: subtotal(), service: serviceCharge(), total: grandTotal(),
    status:'Completed', updatedAt: new Date().toISOString()
  });
  if(state.mode==='dinein'){
    const t = DB.tables.find(x=>x.id===state.table);
    if(t){ t.orderId=null; t.status='free'; }
  }
  saveDB();
  state.status='Completed';
  renderStatus();
  toast('Payment received — order complete ✓');
  printReceipt();
  setTimeout(()=>{
    state.cart=[]; state.discount=0; state.status='New';
    state.orderId = nextOrderId();
    render();
  }, 1400);
}

document.getElementById('navlist').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-view]');
  if(!btn) return;
  if(!canAccess(btn.dataset.view)){ toast("You don't have access to this section"); return; }
  state.view = btn.dataset.view;
  document.querySelectorAll('#navlist button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  if(!confirm('Log out?')) return;
  doLogout();
});

function goToPOS(){
  state.view='pos';
  document.querySelectorAll('#navlist button').forEach(b=>b.classList.toggle('active', b.dataset.view==='pos'));
  render();
}

function render(){
  if(!canAccess(state.view)) state.view = 'pos';
  const root = document.getElementById('viewRoot');
  if(state.view==='pos'){ root.innerHTML = posTemplate(); wirePOS(); }
  else if(state.view==='tables'){ root.innerHTML = tablesTemplate(); wireTables(); }
  else if(state.view==='kitchen'){ root.innerHTML = kitchenTemplate(); renderKitchen(); }
  else if(state.view==='menu'){ root.innerHTML = menuTemplate(); wireMenu(); }
  else if(state.view==='inventory'){ root.innerHTML = inventoryTemplate(); wireInventory(); }
  else if(state.view==='reports'){ root.innerHTML = reportsTemplate(); }
  else if(state.view==='expenses'){ root.innerHTML = expensesTemplate(); wireExpenses(); }
  else if(state.view==='suppliers'){ root.innerHTML = suppliersTemplate(); wireSuppliers(); }
  else if(state.view==='settings'){ root.innerHTML = settingsTemplate(); wireSettings(); }
  else if(state.view==='users'){ root.innerHTML = usersTemplate(); wireUsers(); }
}

function wirePOS(){
  renderMenuGrid();
  renderCart();
  renderTotals();
  renderStatus();

  document.getElementById('modes').addEventListener('click', e=>{
    const b = e.target.closest('button[data-mode]'); if(!b) return;
    state.mode = b.dataset.mode; render();
  });
  document.getElementById('tableSel').addEventListener('change', e=>{
    loadTableIntoState(e.target.value); render();
  });
  document.getElementById('guestInc').addEventListener('click', ()=>{ state.guests=Math.min(20,state.guests+1); document.getElementById('guestBadge').textContent=state.guests; });
  document.getElementById('guestDec').addEventListener('click', ()=>{ state.guests=Math.max(1,state.guests-1); document.getElementById('guestBadge').textContent=state.guests; });
  document.getElementById('searchInput').addEventListener('input', e=>{ state.search = e.target.value; renderMenuGrid(); });
  document.getElementById('catlist').addEventListener('click', e=>{
    const b = e.target.closest('button[data-cat]'); if(!b) return;
    state.activeCat = b.dataset.cat;
    document.querySelectorAll('#catlist button').forEach(x=>x.classList.toggle('active', x===b));
    renderMenuGrid();
  });
  document.getElementById('discountInput').addEventListener('input', e=>{
    state.discount = Math.max(0, parseInt(e.target.value||'0',10));
    renderTotals();
  });
  document.getElementById('payopts').addEventListener('click', e=>{
    const b = e.target.closest('button[data-pay]'); if(!b) return;
    state.payType = b.dataset.pay;
    document.querySelectorAll('#payopts button').forEach(x=>x.classList.toggle('active', x===b));
  });
  document.getElementById('printBtn').addEventListener('click', printReceipt);
  document.getElementById('sendKitchenBtn').addEventListener('click', sendToKitchen);
  document.getElementById('completeBtn').addEventListener('click', completeOrder);
}

function renderMenuGrid(){
  const grid = document.getElementById('menuGrid');
  const q = state.search.trim().toLowerCase();
  const items = DB.menu.filter(m=>
    m.active!==false &&
    (state.activeCat==='all' || m.cat===state.activeCat) &&
    (!q || m.name.toLowerCase().includes(q))
  );
  grid.innerHTML = items.map(m=>`
    <div class="card">
      <div class="thumb" style="--tc1:${m.c1};--tc2:${m.c2}">${m.emoji}</div>
      <div class="cbody">
        <h3>${m.name}</h3>
        <p>${m.desc||''}</p>
        <div class="cfoot">
          <span class="price">${money(m.price)}</span>
          <button class="addbtn" data-add="${m.id}">+</button>
        </div>
      </div>
    </div>
  `).join('') || `<p style="color:var(--ink-soft);padding:20px;">No items match. Try another search, or add items in Menu Manager.</p>`;

  grid.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>addToCart(btn.dataset.add));
  });
}

function addToCart(id){
  const existing = state.cart.find(c=>c.id===id);
  if(existing) existing.qty++;
  else state.cart.push({id, qty:1});
  renderCart(); renderTotals();
  toast(findItem(id).name + ' added');
}
function changeQty(id, delta){
  const c = state.cart.find(c=>c.id===id);
  if(!c) return;
  c.qty += delta;
  if(c.qty<=0) state.cart = state.cart.filter(x=>x.id!==id);
  renderCart(); renderTotals();
}
function removeFromCart(id){
  state.cart = state.cart.filter(c=>c.id!==id);
  renderCart(); renderTotals();
}

function renderCart(){
  const el = document.getElementById('cartList');
  if(!el) return;
  if(state.cart.length===0){
    el.innerHTML = `<div class="empty-cart">No items yet.<br>Tap the + on a menu item to start this order.</div>`;
    return;
  }
  el.innerHTML = state.cart.map(c=>{
    const m = findItem(c.id);
    if(!m) return '';
    return `
    <div class="citem">
      <div class="cthumb" style="--tc1:${m.c1};--tc2:${m.c2}">${m.emoji}</div>
      <div class="cinfo">
        <div class="nm"><span>${m.name}</span><button class="rm" data-rm="${m.id}">🗑</button></div>
        <div class="pr">${money(m.price)}</div>
        <div class="qty">
          <button data-dec="${m.id}">−</button>
          <span class="n">${c.qty}</span>
          <button data-inc="${m.id}">+</button>
        </div>
      </div>
      <div class="line-total">${money(m.price*c.qty)}</div>
    </div>`;
  }).join('');

  el.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click',()=>changeQty(b.dataset.inc,1)));
  el.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click',()=>changeQty(b.dataset.dec,-1)));
  el.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>removeFromCart(b.dataset.rm)));
}

function renderTotals(){
  const sv = document.getElementById('subtotalVal'); if(sv) sv.textContent = money(subtotal());
  const scv = document.getElementById('serviceVal'); if(scv) scv.textContent = money(serviceCharge());
  const gv = document.getElementById('grandVal'); if(gv) gv.textContent = money(grandTotal());
  const sendBtn = document.getElementById('sendKitchenBtn'); if(sendBtn) sendBtn.disabled = state.cart.length===0;
  const compBtn = document.getElementById('completeBtn'); if(compBtn) compBtn.disabled = state.cart.length===0;
}

function renderStatus(){
  const el = document.getElementById('statusSteps');
  if(!el) return;
  const curIdx = STATUSES.indexOf(state.status);
  el.innerHTML = STATUSES.map((s,i)=>{
    const cls = i<curIdx ? 'done' : (i===curIdx ? 'current':'');
    const dot = i<curIdx ? '✓' : (i+1);
    const link = i>0 ? '<span class="steplink"></span>' : '';
    return `${link}<div class="step ${cls}"><span class="dot">${dot}</span>${s}</div>`;
  }).join('');
}

/* ---------- Receipt printing ---------- */
function buildReceiptHTML(){
  const items = state.cart.map(c=>{ const m=findItem(c.id); return m ? {name:m.name, qty:c.qty, price:m.price} : null; }).filter(Boolean);
  const sub = subtotal(), disc = state.discount, svc = serviceCharge(), grand = grandTotal();
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB') + '  ' + now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const where = state.mode==='dinein' ? ('Table '+state.table) : (state.mode==='takeaway' ? 'Takeaway' : 'Delivery');
  const payName = (PAYTYPES.find(p=>p.id===state.payType)||{}).name || state.payType;
  return `
    <div class="rc">
      <div class="rc-center">
        <p class="rc-name">${DB.settings.name}</p>
        <div class="rc-tag">${(DB.settings.tagline||'').toUpperCase()}</div>
      </div>
      <div class="rc-rule"></div>
      <div class="rc-row"><span>Order #${String(state.orderId).padStart(5,'0')}</span><span>${where}</span></div>
      <div class="rc-row"><span>${dateStr}</span><span>${currentUser ? currentUser.name : ''}</span></div>
      <div class="rc-rule"></div>
      <div class="rc-items">
        ${items.length ? items.map(it=>`<div class="rc-row"><span class="rc-item-name">${it.qty}× ${it.name}</span><span>${money(it.price*it.qty)}</span></div>`).join('') : '<div class="rc-row"><span>No items</span></div>'}
      </div>
      <div class="rc-rule"></div>
      <div class="rc-row"><span>Subtotal</span><span>${money(sub)}</span></div>
      ${disc>0 ? `<div class="rc-row"><span>Discount</span><span>-${money(disc)}</span></div>` : ''}
      <div class="rc-row"><span>Service Charge (${DB.settings.servicePct||0}%)</span><span>${money(svc)}</span></div>
      <div class="rc-rule"></div>
      <div class="rc-row rc-grand"><span>Total</span><span>${money(grand)}</span></div>
      <div class="rc-row"><span>Payment</span><span>${payName}</span></div>
      <div class="rc-rule"></div>
      <div class="rc-foot rc-center">Thank you for dining with us!<br>Earth → Fire → Time → Flavor</div>
    </div>
  `;
}
function printReceipt(){
  if(state.cart.length===0){ toast('Nothing to print yet'); return; }
  document.getElementById('receiptArea').innerHTML = buildReceiptHTML();
  window.print();
}

    ${state.addingTable ? tableFormTemplate() : ''}

function tableFormTemplate(){
  return `<div class="inline-form">
    <h3 style="margin-top:0;font-size:14.5px;">New table</h3>
    <div class="form-grid">
      <div class="form-row"><label>Table ID</label><input id="tfId" placeholder="e.g. T13"></div>

      <button class="btn-outline" id="tfCancel">Cancel</button>

function wireTables(){
  document.getElementById('addTableBtn').addEventListener('click', ()=>{ state.addingTable=!state.addingTable; render(); });
  if(state.addingTable){
    document.getElementById('tfCancel').addEventListener('click', ()=>{ state.addingTable=false; render(); });
    document.getElementById('tfSave').addEventListener('click', ()=>{
      const id = val('tfId'); if(!id){ toast('Enter a table ID'); return; }

      DB.tables.push({ id, seats: parseInt(val('tfSeats'))||4, status:'free', orderId:null });

function renderTablesGrid(){
  const grid = document.getElementById('tablesGrid');
  grid.innerHTML = DB.tables.map(t=>{
    const ord = t.orderId ? DB.orders.find(o=>o.id===t.orderId) : null;
    return `<div class="tcard status-${t.status}" data-table="${t.id}">
      <div class="tid">${t.id}</div>
      <div class="tseats">${t.seats} seats</div>
      <div class="tstatus">${t.status.charAt(0).toUpperCase()+t.status.slice(1)}</div>

      ${!t.orderId ? `<button class="btn-outline tcycle" data-cycle="${t.id}">${t.status==='free'?'Mark reserved':'Mark free'}</button>` : ''}
    </div>`;
  }).join('');

  grid.querySelectorAll('.tcard').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('[data-cycle]')) return;
      loadTableIntoState(card.dataset.table);
      goToPOS();
    });
  });
  grid.querySelectorAll('[data-cycle]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const t = DB.tables.find(x=>x.id===b.dataset.cycle);
      t.status = t.status==='free' ? 'reserved' : 'free';
      saveDB(); renderTablesGrid();
    });
  });
}

/* ============================================================
   KITCHEN VIEW
   ============================================================ */
function kitchenTemplate(){
  return `<div class="view">
    <div class="view-head"><h2 class="serif">Kitchen Display</h2></div>
    <div class="kgrid" id="kGrid"></div>
  </div>`;
}
function nextStatus(s){
  const flow = ['Confirmed','Preparing','Ready','Dispatched'];
  const i = flow.indexOf(s);
  if(i===-1 || i===flow.length-1) return null;
  return flow[i+1];
}
function renderKitchen(){
  const grid = document.getElementById('kGrid');
  const active = DB.orders.filter(o=>o.status!=='Completed').sort((a,b)=> new Date(a.createdAt)-new Date(b.createdAt));
  if(active.length===0){
    grid.innerHTML = `<p class="muted">No active orders. Orders sent from POS ("Send to Kitchen") will appear here.</p>`;
    return;
  }
  grid.innerHTML = active.map(o=>{
    const next = nextStatus(o.status);
    const where = o.mode==='dinein' ? 'Table '+o.table : (o.mode==='takeaway' ? 'Takeaway' : 'Delivery');
    return `<div class="kcard">
      <div class="khead"><b>#${String(o.id).padStart(5,'0')}</b><span class="kpill">${o.status}</span></div>
      <div class="ksub">${where} · ${timeAgo(o.createdAt)}</div>
      <ul class="klist">${o.items.map(it=>`<li>${it.qty}× ${it.name}</li>`).join('')}</ul>
      ${next ? `<button class="btn-primary" data-advance="${o.id}">Mark ${next}</button>` : `<span class="kdone">Ready for payment at POS</span>`}
    </div>`;
  }).join('');

  grid.querySelectorAll('[data-advance]').forEach(b=>b.addEventListener('click', ()=>{
    const id = parseInt(b.dataset.advance,10);
    const o = DB.orders.find(x=>x.id===id); if(!o) return;
    const n = nextStatus(o.status); if(!n) return;
    o.status = n; o.updatedAt = new Date().toISOString();
    saveDB();
    if(state.orderId===id) state.status = n;
    renderKitchen();
    toast('Order #'+String(id).padStart(5,'0')+' → '+n);
  }));
}

/* ============================================================
   MENU MANAGER VIEW
   ============================================================ */
function menuTemplate(){
  return `<div class="view">
    <div class="view-head"><h2 class="serif">Menu Manager</h2><button class="btn-primary" id="addMenuBtn">+ Add item</button></div>
    ${state.addingMenu ? menuFormTemplate() : ''}
    <div class="data-table" id="menuTableWrap"></div>
  </div>`;
}
function menuFormTemplate(){
  const editing = state.editingMenuId ? DB.menu.find(m=>m.id===state.editingMenuId) : null;
  const d = editing || {name:'',cat:'beef',price:0,emoji:'🍽️',desc:'',active:true};
  return `<div class="inline-form">
    <h3 style="margin-top:0;font-size:14.5px;">${editing?'Edit item':'New menu item'}</h3>
    <div class="form-grid">
      <div class="form-row"><label>Name</label><input id="mfName" value="${escapeAttr(d.name)}"></div>
      <div class="form-row"><label>Category</label><select id="mfCat">${CATS.filter(c=>c.id!=='all').map(c=>`<option value="${c.id}" ${c.id===d.cat?'selected':''}>${c.name}</option>`).join('')}</select></div>
      <div class="form-row"><label>Price (${DB.settings.currency})</label><input id="mfPrice" type="number" min="0" value="${d.price}"></div>
      <div class="form-row"><label>Emoji</label><input id="mfEmoji" value="${escapeAttr(d.emoji)}" maxlength="4"></div>
      <div class="form-row" style="grid-column:1/-1;"><label>Description</label><input id="mfDesc" value="${escapeAttr(d.desc)}"></div>
      <div class="form-row"><label><input type="checkbox" id="mfActive" ${d.active!==false?'checked':''}> Active (visible in POS)</label></div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" id="mfSave">${editing?'Save changes':'Add item'}</button>
      <button class="btn-outline" id="mfCancel">Cancel</button>
    </div>
  </div>`;
}
function wireMenu(){
  document.getElementById('addMenuBtn').addEventListener('click', ()=>{
    state.editingMenuId = null; state.addingMenu = !state.addingMenu; render();
  });
  if(state.addingMenu){
    document.getElementById('mfCancel').addEventListener('click', ()=>{ state.addingMenu=false; state.editingMenuId=null; render(); });
    document.getElementById('mfSave').addEventListener('click', ()=>{
      const name = val('mfName'); if(!name){ toast('Name is required'); return; }
      const cat = document.getElementById('mfCat').value;
      const price = parseFloat(val('mfPrice'))||0;
      const emoji = val('mfEmoji') || '🍽️';
      const desc = val('mfDesc');
      const active = document.getElementById('mfActive').checked;
      if(state.editingMenuId){
        Object.assign(DB.menu.find(m=>m.id===state.editingMenuId), {name,cat,price,emoji,desc,active});
      } else {
        DB.menu.push({ id: uid('item'), name, cat, price, emoji, desc, active, c1:'#E7D3B4', c2:'#C9A876' });
      }
      saveDB();
      state.addingMenu=false; state.editingMenuId=null;
      render();
      toast('Menu updated');
    });
  }

function renderInvTable(){
  const wrap = document.getElementById('invTableWrap');
  wrap.innerHTML = `

    `).join('') || `<div class="drow"><span class="muted">No stock items yet.</span></div>`}
  `;
  wrap.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>{ adjustInv(b.dataset.inc, 1); }));
  wrap.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>{ adjustInv(b.dataset.dec, -1); }));
  wrap.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{

    DB.inventory = DB.inventory.filter(x=>x.id!==b.dataset.del);

}
function adjustInv(id, delta){
  const it = DB.inventory.find(x=>x.id===id); if(!it) return;
  it.qty = Math.max(0, it.qty+delta);
  saveDB(); renderInvTable();
}

/* ============================================================
   REPORTS VIEW
   ============================================================ */
function reportsTemplate(){
  const completed = DB.orders.filter(o=>o.status==='Completed');
  if(completed.length===0){
    return `<div class="view"><div class="view-head"><h2 class="serif">Reports</h2></div>
      <p class="muted">No completed orders yet. Once you complete an order's payment in POS, sales data will appear here.</p></div>`;
  }
  const revenue = completed.reduce((s,o)=>s+o.total,0);
  const count = completed.length;
  const avg = count ? Math.round(revenue/count) : 0;

  const itemAgg = {};
  completed.forEach(o=>o.items.forEach(it=>{ itemAgg[it.name]=(itemAgg[it.name]||0)+it.qty; }));
  const topItems = Object.entries(itemAgg).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxQty = topItems.length ? topItems[0][1] : 1;

  const payAgg = {};
  completed.forEach(o=>{ payAgg[o.payType]=(payAgg[o.payType]||0)+o.total; });
  const payEntries = Object.entries(payAgg).sort((a,b)=>b[1]-a[1]);
  const maxPay = Math.max(1, ...payEntries.map(e=>e[1]));

  return `<div class="view">
    <div class="view-head"><h2 class="serif">Reports</h2></div>
    <div class="stat-cards">
      <div class="stat-card"><span class="sl">Total Revenue</span><b>${money(revenue)}</b></div>
      <div class="stat-card"><span class="sl">Orders Completed</span><b>${count}</b></div>
      <div class="stat-card"><span class="sl">Average Order</span><b>${money(avg)}</b></div>
    </div>
    <div class="report-cols">
      <div class="report-block">
        <h3>Top Selling Items</h3>
        <div class="barlist">${topItems.map(([name,qty])=>`
          <div class="baritem"><span>${name}</span><div class="btrack"><div class="bfill" style="width:${(qty/maxQty*100)}%"></div></div><span class="bv">${qty}</span></div>
        `).join('')}</div>
      </div>
      <div class="report-block">
        <h3>Revenue by Payment Type</h3>
        <div class="barlist">${payEntries.map(([type,amt])=>`
          <div class="baritem"><span>${(PAYTYPES.find(p=>p.id===type)||{}).name || type}</span><div class="btrack"><div class="bfill" style="width:${(amt/maxPay*100)}%"></div></div><span class="bv">${money(amt)}</span></div>
        `).join('')}</div>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   USERS & ROLES VIEW (Super Admin only)
   ============================================================ */
const ROLE_OPTIONS = ['Manager','Cashier','Founder','Super Admin'];
function usersTemplate(){
  return `<div class="view">
    <div class="view-head"><h2 class="serif">Users &amp; Roles</h2><button class="btn-primary" id="addUserBtn">+ Add account</button></div>
    <p class="muted" style="margin-top:-8px;">These logins are stored in this browser only, for now — moving to Supabase later will make them work across every device securely.</p>
    ${state.addingUser ? userFormTemplate() : ''}
    <div class="data-table" id="userTableWrap"></div>
  </div>`;
}
function userFormTemplate(){
  const editing = state.editingUserId ? DB.users.find(u=>u.id===state.editingUserId) : null;
  const d = editing || {username:'',password:'',name:'',role:'Cashier',active:true};
  return `<div class="inline-form">
    <h3 style="margin-top:0;font-size:14.5px;">${editing?'Edit account':'New account'}</h3>
    <div class="form-grid">
      <div class="form-row"><label>Username</label><input id="ufUsername" value="${escapeAttr(d.username)}"></div>
      <div class="form-row"><label>Password</label><input id="ufPassword" type="text" value="${editing?'':escapeAttr(d.password)}" placeholder="${editing?'Leave blank to keep current':''}"></div>
      <div class="form-row"><label>Full name</label><input id="ufName" value="${escapeAttr(d.name)}"></div>
      <div class="form-row"><label>Role</label><select id="ufRole">${ROLE_OPTIONS.map(r=>`<option ${r===d.role?'selected':''}>${r}</option>`).join('')}</select></div>
      <div class="form-row"><label>Custom title (optional)</label><input id="ufCustomRole" placeholder="Overrides Role above if filled"></div>
      <div class="form-row"><label><input type="checkbox" id="ufActive" ${d.active!==false?'checked':''}> Active (can log in)</label></div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" id="ufSave">${editing?'Save changes':'Create account'}</button>
      <button class="btn-outline" id="ufCancel">Cancel</button>
    </div>
  </div>`;
}
function wireUsers(){
  document.getElementById('addUserBtn').addEventListener('click', ()=>{
    state.editingUserId = null; state.addingUser = !state.addingUser; render();
  });
  if(state.addingUser){
    document.getElementById('ufCancel').addEventListener('click', ()=>{ state.addingUser=false; state.editingUserId=null; render(); });
    document.getElementById('ufSave').addEventListener('click', ()=>{
      const username = val('ufUsername'); const name = val('ufName');
      const role = val('ufCustomRole') || document.getElementById('ufRole').value;
      const active = document.getElementById('ufActive').checked;
      const pw = val('ufPassword');
      if(!username || !name){ toast('Username and full name are required'); return; }
      const dupe = DB.users.find(u=>u.username===username && u.id!==state.editingUserId);
      if(dupe){ toast('That username is already taken'); return; }
      if(state.editingUserId){
        const u = DB.users.find(x=>x.id===state.editingUserId);
        Object.assign(u, {username, name, role, active});
        if(pw) u.password = pw;
      } else {
        if(!pw){ toast('Password is required for a new account'); return; }
        DB.users.push({ id: uid('user'), username, password: pw, name, role, active });
      }
      saveDB();
      state.addingUser=false; state.editingUserId=null;
      render();
      toast('Account saved');
    });
  }
  renderUsersTable();
}
function renderUsersTable(){
  const wrap = document.getElementById('userTableWrap');
  wrap.innerHTML = `
    <div class="drow dhead suprow"><span>Username</span><span>Name</span><span>Role</span><span>Active</span><span></span></div>
    ${DB.users.map(u=>`
      <div class="drow suprow">
        <span>${u.username}</span>
        <span>${u.name}</span>
        <span><span class="tag-pill">${u.role}</span></span>
        <span>${u.active!==false ? '✅' : '🚫'}</span>
        <span class="dcell-actions">
          <button class="pillbtn" data-edit="${u.id}" title="Edit">✎</button>
          <button class="pillbtn" data-del="${u.id}" title="Delete">🗑</button>
        </span>
      </div>
    `).join('')}
  `;
  wrap.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
    state.editingUserId = b.dataset.edit; state.addingUser = true; render();
  }));
  wrap.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    const target = DB.users.find(u=>u.id===b.dataset.del);
    if(currentUser && target.id===currentUser.id){ toast("You can't delete the account you're logged in as"); return; }
    const remainingSuperAdmins = DB.users.filter(u=>u.role==='Super Admin' && u.id!==target.id && u.active!==false);
    if(target.role==='Super Admin' && remainingSuperAdmins.length===0){ toast('At least one active Super Admin must remain'); return; }
    if(!confirm('Delete the account "'+target.username+'"?')) return;
    DB.users = DB.users.filter(u=>u.id!==target.id);
    saveDB(); renderUsersTable(); toast('Account deleted');
  }));
}

/* ============================================================
   BOOT
   ============================================================ */
async function attemptLogin(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const ok = doLogin(username, password);
  if(ok){ showApp(); startRealtime(); }
  else { document.getElementById('loginError').textContent = 'Invalid username or password.'; }
}

(async function boot(){
  await loadDB();

  if(!DB.tables.some(t=>t.id===state.table)) state.table = DB.tables[0] ? DB.tables[0].id : state.table;
  state.orderId = nextOrderId();

  document.getElementById('loginBrandName').textContent = DB.settings.name;
  document.getElementById('loginBrandTag').textContent = DB.settings.tagline;
  const loginBtn = document.getElementById('loginSubmit');
  loginBtn.disabled = false;
  loginBtn.textContent = 'Log in';
  loginBtn.addEventListener('click', attemptLogin);
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });
  document.getElementById('loginUser').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });

  currentUser = loadSession();
  if(currentUser){ showApp(); startRealtime(); } else { showLogin(); }
})();
</script>
